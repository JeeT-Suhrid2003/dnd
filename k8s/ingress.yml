apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dnd-ingress
  namespace: default
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dnd.example.com
      secretName: dnd-local-tls
  rules:
    - host: dnd.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dnd-gateway
                port:
                  number: 8000
