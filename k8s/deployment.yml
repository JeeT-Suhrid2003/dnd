apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dnd-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnd-postgres
  labels:
    thing: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      thing: dnd-postgres
  template:
    metadata:
      labels:
        thing: dnd-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: dnd
            - name: POSTGRES_USER
              value: dnd
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dnd-db-credentials
                  key: password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: dnd-postgres-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnd-dice
  labels:
    thing: dice
spec:
  replicas: 1
  selector:
    matchLabels:
      thing: dnd-dice
  template:
    metadata:
      labels:
        thing: dnd-dice
    spec:
      containers:
        - name: dnd-dice
          image: ejeet2026/dnd-dice:latest
          ports:
            - containerPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnd-character
  labels:
    thing: character
spec:
  replicas: 1
  selector:
    matchLabels:
      thing: dnd-character
  template:
    metadata:
      labels:
        thing: dnd-character
    spec:
      containers:
        - name: dnd-character
          image: ejeet2026/dnd-character:latest
          ports:
            - containerPort: 8002
          env:
            - name: DB_HOST
              value: dnd-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: dnd
            - name: DB_USER
              value: dnd
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dnd-db-credentials
                  key: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnd-combat
  labels:
    thing: combat
spec:
  replicas: 1
  selector:
    matchLabels:
      thing: dnd-combat
  template:
    metadata:
      labels:
        thing: dnd-combat
    spec:
      containers:
        - name: dnd-combat
          image: ejeet2026/dnd-combat:latest
          ports:
            - containerPort: 8003
          env:
            - name: DICE_URL
              value: http://dnd-dice:8001
            - name: CHARACTER_URL
              value: http://dnd-character:8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnd-gateway
  labels:
    thing: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      thing: dnd-gateway
  template:
    metadata:
      labels:
        thing: dnd-gateway
    spec:
      containers:
        - name: dnd-gateway
          image: ejeet2026/dnd-gateway:latest
          ports:
            - containerPort: 8000
          env:
            - name: DICE_URL
              value: http://dnd-dice:8001
            - name: CHARACTER_URL
              value: http://dnd-character:8002
            - name: COMBAT_URL
              value: http://dnd-combat:8003
---
