<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111313">
  <title>Create a character — Ember & Iron</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Ember and Iron home">
        <span class="brand-mark" aria-hidden="true">E</span>
        <span>EMBER <span class="brand-amp">&</span> IRON</span>
      </a>
      <a class="nav-link" href="/">← Back to the game</a>
    </header>

    <main class="creator-main">
      <section class="creator-intro">
        <p class="eyebrow"><span class="eyebrow-line"></span> BUILD YOUR COMBATANT</p>
        <h1>Make a new<br><em>legend.</em></h1>
        <p class="hero-description">Create a character or creature to join the next encounter.</p>
      </section>

      <form class="character-form" id="character-form">
        <div class="form-grid">
          <label class="form-field form-field-wide">
            <span>Name</span>
            <input name="name" type="text" maxlength="80" required placeholder="e.g. Mira Quickstep">
          </label>
          <label class="form-field">
            <span>Combatant type</span>
            <select name="kind">
              <option value="player">Player character</option>
              <option value="monster">Monster</option>
            </select>
          </label>
          <label class="form-field">
            <span>Class or creature type</span>
            <input name="char_class" type="text" maxlength="50" value="Fighter" required>
          </label>
          <label class="form-field">
            <span>Level</span>
            <input name="level" type="number" min="1" max="20" value="1" required>
          </label>
          <label class="form-field">
            <span>Maximum HP</span>
            <input name="max_hp" type="number" min="1" value="10" required>
          </label>
          <label class="form-field">
            <span>Armor class</span>
            <input name="ac" type="number" min="1" value="10" required>
          </label>
          <label class="form-field">
            <span>Attack bonus</span>
            <input name="attack_bonus" type="number" value="0" required>
          </label>
          <label class="form-field form-field-wide">
            <span>Damage dice</span>
            <input name="damage_dice" type="text" value="1d6" pattern="[0-9]*[dD][0-9]+([kK][hH][0-9]+|[kK][lL][0-9]+)?(\+[0-9]+|-[0-9]+)?" required>
            <small>Dice notation, for example 1d8+3 or 2d6.</small>
          </label>
        </div>

        <fieldset class="ability-fields">
          <legend>Ability scores</legend>
          <div class="form-grid ability-grid">
            <label class="form-field"><span>Strength</span><input name="strength" type="number" min="1" max="30" value="10"></label>
            <label class="form-field"><span>Dexterity</span><input name="dexterity" type="number" min="1" max="30" value="10"></label>
            <label class="form-field"><span>Constitution</span><input name="constitution" type="number" min="1" max="30" value="10"></label>
            <label class="form-field"><span>Intelligence</span><input name="intelligence" type="number" min="1" max="30" value="10"></label>
            <label class="form-field"><span>Wisdom</span><input name="wisdom" type="number" min="1" max="30" value="10"></label>
            <label class="form-field"><span>Charisma</span><input name="charisma" type="number" min="1" max="30" value="10"></label>
          </div>
        </fieldset>

        <p class="form-error" id="form-error" role="alert" hidden></p>
        <button class="button button-primary form-submit" type="submit">
          <span>Create character</span><span aria-hidden="true">↗</span>
        </button>
        <p class="form-success" id="form-success" role="status" hidden></p>
      </form>
    </main>
    <footer><span>EMBER & IRON</span><span>A little adventure, one roll at a time.</span></footer>
  </div>
  <script src="./create-character.js" defer></script>
</body>
</html>
