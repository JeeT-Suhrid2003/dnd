services:
  dice:
    build:
      context: .
      dockerfile: services/dice/Dockerfile
    container_name: dnd-dice
    expose:
      - "8001"

  character:
    build:
      context: .
      dockerfile: services/character/Dockerfile
    container_name: dnd-character
    expose:
      - "8002"

  combat:
    build:
      context: .
      dockerfile: services/combat/Dockerfile
    container_name: dnd-combat
    expose:
      - "8003"

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: dnd-gateway
    ports:
      - "8000:8000"
    depends_on:
      - dice
      - character
      - combat
    